<div #board class="boardContainer"
    [style.width]="size()"
    [style.height]="size()">
    @for( rank of state().pieceState; let rankIndex = $index; track rankIndex)
    {
        <ng-container>
            @for ( piece of rank; let fileIndex = $index; track fileIndex; )
            {
                <div style="position: relative; width: 100%; height: 100%;">
                    <app-square 
                        [coordinate]="this.COORDS[rankIndex][fileIndex]" 
                        [piece]="state().pieceState[rankIndex][fileIndex]"
                        [isDark]="(rankIndex + fileIndex) % 2 == 1"
                        [showFile]="false"
                        [showRank]="false"
                        [showPiece]="true">
                    </app-square>
                </div>
            }
        </ng-container>
    }
</div>
