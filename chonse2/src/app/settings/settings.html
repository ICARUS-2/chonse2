
<div class="container">
    <h1 class="text-primary">Settings</h1>
    <hr>

    <h2 class="text-primary">Board</h2>
    <h4 class="text-secondary">Click to move</h4>
    <div class="form-check form-switch">
        <input
            class="form-check-input"
            type="checkbox"
            id="darkModeSwitch"
            [(ngModel)]="clickToMove"
            (ngModelChange)="handleClickToMoveSwitchPressed($event)"
        />
    </div>

    <hr>
    <h2 class="text-primary">Engine</h2>
    <h4 class="text-secondary">Select Engine</h4>
    <select [(ngModel)]="selectedEngine" class="form-select" (ngModelChange)="handleEngineDropdownSelectionChanged()">
        @for(engine of Object.values(EngineName); track $index)
        {
            <option [value]="engine">{{EngineDisplayName.get(engine)}}</option>
        }
    </select>
        
    <div class="m-4"></div>

    <h4 class="text-secondary">Engine Depth</h4>
    <div class="d-flex">
        <input (ngModelChange)="handleEngineDepthChanged()" [(ngModel)]="engineDepth" type="range" class="form-range" min="10" max="30" id="range2">
        <p>{{engineDepth}}</p>
    </div>
</div>
