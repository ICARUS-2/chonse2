<div class="componentContainer d-flex flex-column p-3" [class]="themeService.getThemeInstance().getGlassPanelTheme()" [style.background-image]="`url(${themeService.getThemeInstance().getBackgroundImgUrl()})`" [style.color]="themeService.getThemeInstance().getTextColor()">
    
    <div [class]="themeService.getThemeInstance().getGlassPanelTheme()" class="p-4">
        <h2 [style.color]="themeService.getThemeInstance().getPrimaryColor()">{{"vsAiModal.title" | translate}}</h2>

        <hr>

        <div [style.--slider-color]="themeService.getThemeInstance().getPrimaryColor()">
            <label>{{"vsAiModal.setElo" | translate}}</label>
            <input [formField]="form.elo" type="range" class="form-range custom-range"  id="range2">
            <p>{{form.elo().value()}}</p>
        </div>
    
        <div class="m-3"></div>

        <div class="">
            <label>{{"vsAiModal.iPlayAsWhite" | translate}}</label>
            <div class="form-check form-switch"
            [style.--switch-color]="themeService.getThemeInstance().getPrimaryColor()">
                <input
                    class="form-check-input custom-switch"
                    type="checkbox"
                    [formField]="form.isHumanPlayerWhite"
                />
            </div>
        </div>

        <hr>

        <app-bootstrap-button (buttonClick)="submitClicked()" [label]="'vsAiModal.beginGameBtn' | translate"></app-bootstrap-button>
    </div>
</div>
