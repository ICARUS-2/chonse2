<!-- game-info.component.html -->
<div class="p-4 gameInfo"
  [ngClass]="themeService.getThemeInstance().getGlassPanelTheme()"
  [style.color]="themeService.getThemeInstance().getTextColor()">

  <!--Whose turn it is-->
  <div
    [style.color]="themeService.getThemeInstance().getTextColor()"
    class="d-flex flex-column justify-content-center"
  >
    {{  turn }}
  </div>

  <hr>

  <!--The opening-->
  <div
    [style.color]="themeService.getThemeInstance().getTextColor()"
    class="d-flex flex-column justify-content-center"
  >
    {{ getOpeningDisplay() }}
  </div>

  <hr>

  <!--Game status-->
  <div
    [style.color]="themeService.getThemeInstance().getTextColor()"
    class="d-flex flex-column justify-content-center"
  >
    {{  statusText }}
  </div>

  <hr>

  <!--FEN display-->
  <div
    [style.color]="themeService.getThemeInstance().getTextColor()"
    class="d-flex flex-column justify-content-center fenDisplay gap-2"
  >
    @let btnStyle = { 'width': '170px', 'height': '35px', 'font-size' : '15px'};
    <app-icon-button [extraStyle]="btnStyle" iconClass="bi-clipboard" [label]="'chessboard.gameInfo.copyFen' | translate" (buttonClick)="copyFenClicked()"></app-icon-button>
    <app-icon-button [extraStyle]="btnStyle" iconClass="bi-arrow-up-right" [label]="'chessboard.gameInfo.openFenInEditor' | translate" (buttonClick)="openFenInEditorClicked()"></app-icon-button>
  </div>
</div>
