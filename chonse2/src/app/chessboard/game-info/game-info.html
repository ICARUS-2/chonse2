<!-- game-info.component.html -->
<div class="p-4 gameInfo"
  [ngClass]="themeService.getThemeInstance().getGlassPanelTheme()"
  [style.color]="themeService.getThemeInstance().getTextColor()">

  <!--Whose turn it is-->
  <div
    [style.color]="themeService.getThemeInstance().getTextColor()"
    class="evalTextData d-flex flex-column justify-content-center"
  >
    {{  turn }}
  </div>

  <hr>

  <!--The opening-->
  <div
    [style.color]="themeService.getThemeInstance().getTextColor()"
    class="evalTextData d-flex flex-column justify-content-center"
  >
    {{ getOpeningDisplay() }}
  </div>

  <hr>

  <!--Game status-->
  <div
    [style.color]="themeService.getThemeInstance().getTextColor()"
    class="evalTextData d-flex flex-column justify-content-center"
  >
    {{  statusText }}
  </div>
</div>
