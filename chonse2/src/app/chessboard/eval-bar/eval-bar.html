<div class="evalBarContainer" [style.border]="`1px solid ${themeService.getThemeInstance().getBorderColor()}`">
    <div class="progress progress-vertical bg-black">
        <div 
            class="progress-bar bg-white"
            role="progressbar"
            [style.height.%]="data.whiteBarPercentage">
        </div>
    </div>

    <div 
        class="evalLabel" 
        [ngClass]="{'top': data.whiteBarPercentage < 50, 'bottom': data.whiteBarPercentage >= 50}">
        {{ data.label }}
    </div>
</div>
