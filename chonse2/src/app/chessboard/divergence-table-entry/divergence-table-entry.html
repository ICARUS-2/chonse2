<td colspan="3" class="ps-4" [style.border]="`1px solid ${themeService.getThemeInstance().getBorderColor()}`">
    <i class="bi bi-arrow-return-right"></i>

    <table class="w-100">
        <tbody class="">
            @for(item of moveStack(); track $index)
            {
                @if ($index % 2 == 0)
                {
                    <tr>
                        <td>
                            <p class="d-inline move-number">{{ ($index / 2) + 1 }}. </p>
                        </td>

                        <td>
                            <div class="d-inline">{{item.notation}}</div>
                        </td>

                        <td>
                            <div class="d-inline">{{moveStack()[$index + 1] == null ? "-" : moveStack()[$index + 1].notation}}</div>
                        </td>
                    </tr>
                }
            }
        </tbody>
    </table>

</td>
