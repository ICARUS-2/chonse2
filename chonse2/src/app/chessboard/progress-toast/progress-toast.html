<div class="progress-toast" #toast>
    <div class="toast-body">
        <span class="toast-icon">
        <i class="bi bi-info-circle-fill"></i>
        </span>
        <span class="">{{"chessboard.progressToast.analyzing" | translate}} {{boardState().evalProgress().toFixed(1)}}%</span>
        <span>(<span class="bi bi-diagram-3-fill"></span> {{LocalStorageHelper.getNumber(LocalStorageHelper.ENGINE_DEPTH)}})</span>
    </div>

    <ngb-progressbar
        type="info"
        [value]="boardState().evalProgress()"
        [striped]="true"
        [animated]="true"
    />
</div>
