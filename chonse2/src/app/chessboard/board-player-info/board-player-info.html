<div class="boardPlayerInfoContainer d-flex align-items-center">
    
    <p [style.color]="themeService.getThemeInstance().getTextColor()">{{playerName()}} {{playerElo() ? `(${playerElo()})` : ""}}</p>
    
    <div class="m-1"></div>

    <div class="pieceGroupContainer">
        @for(key of getDisplayMap().keys(); track $index)
        {
            <div class="piece-group">
                @for(i of [].constructor(getDisplayMap().get(key)); track $index)
                {
                    <img class="capturedPieceImg" [src]="`piece/merida/${key}.svg`" alt="piece" />
                }
            </div>
        }
    </div>

    @if(getAbsoluteAdvantage() > 0)
    {
        <p class="m-0" [style.color]="themeService.getThemeInstance().getPrimaryColor()">+{{getAbsoluteAdvantage()}}</p>
    }
    
    <div class="m-1"></div>

    @if (clock())
    {
        <p class="badge text-bg-secondary">{{clock()}}</p>
    }
</div>
