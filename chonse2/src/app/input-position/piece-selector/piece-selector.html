<div class="d-flex align-items-center justify-content-around componentContainer m-1">
    <app-square class="square border" [isDark]="for != PieceColor.WHITE" [piece]="for == PieceColor.WHITE ? PieceType.WHITE_PAWN : PieceType.BLACK_PAWN"></app-square>
    <app-square class="square border" [isDark]="for != PieceColor.WHITE" [piece]="for == PieceColor.WHITE ? PieceType.WHITE_KNIGHT : PieceType.BLACK_KNIGHT"></app-square>
    <app-square class="square border" [isDark]="for != PieceColor.WHITE" [piece]="for == PieceColor.WHITE ? PieceType.WHITE_BISHOP : PieceType.BLACK_BISHOP"></app-square>
    <app-square class="square border" [isDark]="for != PieceColor.WHITE" [piece]="for == PieceColor.WHITE ? PieceType.WHITE_ROOK : PieceType.BLACK_ROOK"></app-square>
    <app-square class="square border" [isDark]="for != PieceColor.WHITE" [piece]="for == PieceColor.WHITE ? PieceType.WHITE_QUEEN : PieceType.BLACK_QUEEN"></app-square>
    <app-square class="square border" [isDark]="for != PieceColor.WHITE" [piece]="for == PieceColor.WHITE ? PieceType.WHITE_KING : PieceType.BLACK_KING"></app-square>
    <div class="square border deleteSquare d-flex justify-content-center align-items-center bg-info"><i class="bi deleteIcon" [ngClass]="{'bi-trash': for == PieceColor.WHITE, 'bi-trash-fill': for == PieceColor.BLACK}"></i></div>
</div>
