<div class="componentContainer d-flex flex-column p-3" [class]="themeService.getThemeInstance().getGlassPanelTheme()" [style.background-image]="`url(${themeService.getThemeInstance().getBackgroundImgUrl()})`" [style.color]="themeService.getThemeInstance().getTextColor()">
    
    <div [class]="themeService.getThemeInstance().getGlassPanelTheme()" class="p-4">
        <h2 [style.color]="themeService.getThemeInstance().getPrimaryColor()">Import FEN</h2>

        <hr>

        <div>
            <textarea spellcheck="false" class="w-100 fenInput" [style.color]="themeService.getThemeInstance().getTextColor()" [class]="themeService.getThemeInstance().getGlassPanelTheme()" [formField]="form.fen" type="text"></textarea>
        </div>
    
        <div class="m-3"></div>

        <hr>

        <app-bootstrap-button (buttonClick)="submitClicked()" label="Confirm"></app-bootstrap-button>
    </div>
</div>
