<button class="btn button" 
    [style.--btn-bg]="themeService.getThemeInstance().getPrimaryColor()"
    [style.--btn-hover]="themeService.getThemeInstance().getHoverColor()"
    [style.color]="themeService.getThemeInstance().getTextColor()"
    [ngClass]="[extraClasses]"
    [disabled]="disabled"
    (click)="onButtonClicked()">{{label}}</button>
