<div class="container">
    <h1 [style.color]="themeService.getThemeInstance().getPrimaryColor()">{{"pgnLink.title" | translate}}</h1>

    <h2 [style.color]="themeService.getThemeInstance().getTextColor()"></h2>

    <textarea class="pgnTextArea d-block"
    spellcheck="false"
    [style.color]="themeService.getThemeInstance().getTextColor()"
    [class]="themeService.getThemeInstance().getGlassPanelTheme()" 
    [style.border]="'1px solid ' + themeService.getThemeInstance().getBorderColor()"
    [placeholder]="'pgnLink.placeholder' | translate"
    [formField]="form.pgnText"></textarea>

    <app-bootstrap-button (buttonClick)="onBtnClicked()" [label]="'pgnLink.generateBtnText' | translate"></app-bootstrap-button>
</div>
